[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-dataset-loader"
version = "0.1.0"
description = "Streaming access tools for the Quran Muaalem annotated dataset"
requires-python = ">=3.10"
dependencies = [
  "datasets>=4.0,<5",
  "huggingface_hub>=1.0,<2",
  "numpy>=1.26,<3",
  "pandas>=2.0,<4",
  "quran-transcript==0.6.1",
  "requests>=2.31,<3",
  "scipy>=1.11,<2",
  "safetensors>=0.4,<1",
  "soundfile>=0.12,<1",
  "torch>=2.0",
  "transformers>=4.45,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbclient>=0.10", "nbformat>=5.9"]
audio-denoise = ["noisereduce>=3,<4"]
notebook = ["matplotlib>=3.7,<4", "ipython>=8,<10", "nbclient>=0.10", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
